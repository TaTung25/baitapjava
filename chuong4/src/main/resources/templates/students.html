<html xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <title>Danh sách sinh viên</title>

        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f6f8;
                margin: 0;
                padding: 40px;
            }

            .container {
                width: 900px;
                margin: auto;
                background-color: white;
                padding: 30px;
                border-radius: 10px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            }

            h1 {
                text-align: center;
                color: #2c3e50;
                margin-bottom: 30px;
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            th {
                background-color: #3498db;
                color: white;
                padding: 12px;
                text-align: center;
            }

            td {
                padding: 12px;
                border: 1px solid #ddd;
                text-align: center;
            }

            tr:nth-child(even) {
                background-color: #f2f2f2;
            }

            tr:hover {
                background-color: #eaf4ff;
            }

            .back-link {
                display: inline-block;
                margin-top: 20px;
                padding: 10px 18px;
                background-color: #3498db;
                color: white;
                text-decoration: none;
                border-radius: 5px;
            }

            .back-link:hover {
                background-color: #217dbb;
            }
        </style>

    </head>

    <body>

        <div class="container">

            <h1>Danh sách sinh viên</h1>

            <table>

                <tr>
                    <th>Mã SV</th>
                    <th>Họ tên</th>
                    <th>Email</th>
                    <th>Lớp</th>
                </tr>

                <tr th:each="s : ${students}">
                    <td th:text="${s.studentCode}"></td>
                    <td th:text="${s.fullName}"></td>
                    <td th:text="${s.email}"></td>
                    <td th:text="${s.className}"></td>
                </tr>

            </table>

            <a class="back-link" th:href="@{/}">
                ← Về trang chủ
            </a>

        </div>

    </body>

</html>
